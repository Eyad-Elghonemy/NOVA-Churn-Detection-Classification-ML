[project]
name = "churn-detection-classification"
version = "1.0.0"
description = "Churn Detection Classification API"
requires-python = "==3.12.*"
dependencies = [
    "fastapi[standard] == 0.139.0",
    "uvicorn == 0.49.0",
    "scikit-learn == 1.7.1",
    "xgboost == 3.3.0",
    "imbalanced-learn == 0.14.2",
    "python-dotenv == 1.2.2",
    "python-multipart == 0.0.32",
    "streamlit==1.59.0",
    "requests==2.32.3",
    "pandas==2.2.3",
    "plotly==6.8.0",
    "supabase==2.31.0",
    "Pillow==11.0.0",
]

[tool.uv]
package = false

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []